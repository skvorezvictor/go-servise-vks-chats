server {
    listen 80;
    server_name go.example.ru;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name go.example.ru;

    wallarm_mode monitoring; # Режим работы Вебмониторэкс
    wallarm_application 100000; # идентификатор приложения для домена

    ssl_certificate     /etc/nginx/ssl/go.example.ru.crt;
    ssl_certificate_key /etc/nginx/ssl/go.example.ru.key;

    location /moderator/ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass http://127.0.0.1:4181;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        proxy_busy_buffers_size 32k;
    }

    location /oauth2/ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass http://127.0.0.1:4181;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        proxy_busy_buffers_size 32k;
    }


    location /app/call/ {
        proxy_pass http://127.0.0.1:3303;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /app/assets/ {
        proxy_pass http://127.0.0.1:3303;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /app {
        return 301 /app/;
    }

    location /app/ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass http://127.0.0.1:4181;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        proxy_busy_buffers_size 32k;
    }

    location /_matrix/ {
        client_max_body_size 100m;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass http://127.0.0.1:8008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }

    location = /branding.json {
        alias /etc/nginx/branding/branding.json;
        default_type application/json;
    }
    location = /logo.svg {
        alias /etc/nginx/branding/logo.svg;
        default_type image/svg+xml;
    }

    # Single-segment static files that must bypass the room-name gate below.
    location = /config.js { proxy_pass https://127.0.0.1:8443; proxy_ssl_verify off; proxy_set_header Host $host; }
    location = /interface_config.js { proxy_pass https://127.0.0.1:8443; proxy_ssl_verify off; proxy_set_header Host $host; }
    location = /external_api.js { proxy_pass https://127.0.0.1:8443; proxy_ssl_verify off; proxy_set_header Host $host; }
    location = /manifest.json { proxy_pass https://127.0.0.1:8443; proxy_ssl_verify off; proxy_set_header Host $host; }
    location = /pwa-worker.js { proxy_pass https://127.0.0.1:8443; proxy_ssl_verify off; proxy_set_header Host $host; }
    location = /favicon.ico { proxy_pass https://127.0.0.1:8443; proxy_ssl_verify off; proxy_set_header Host $host; }
    location = /robots.txt { proxy_pass https://127.0.0.1:8443; proxy_ssl_verify off; proxy_set_header Host $host; }

    location = /http-bind {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /xmpp-websocket {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # Room-name / welcome-page requests only (single path segment, e.g. "/" or "/1122").
    # Internal-network users without a jwt yet get bounced through the existing
    # /moderator/ flow (Keycloak login -> jwt-minter) so they become moderator
    # transparently; everyone else (external guests, or a request that already
    # carries ?jwt=...) goes straight to the Jitsi app unchanged.
    location ~ ^/([^/?&:'"]*)$ {
        if ($arg_jwt) {
            break;
        }
        # jwt-minter шлёт сюда "не модератора" гостем (без jwt, только
        # guest_name/guest_email для префилла) -- без этого условия nginx
        # заворачивал такой редирект обратно на /moderator/, а тот снова
        # отказывал (чужой claim ещё жив) -> бесконечный цикл редиректов.
        if ($arg_guest_name) {
            break;
        }
        # Собственный iframe Jitsi (JitsiMeetExternalAPI) грузит голый
        # go.example.ru/<room> без jwt для гостевого (не-модераторского) входа --
        # это не переход пользователя в браузере, и его нельзя заворачивать
        # на /moderator/ (Keycloak откажется открываться во встроенном фрейме).
        if ($http_sec_fetch_dest = "iframe") {
            break;
        }
        set $ext_root "$is_internal:$1";
        if ($ext_root = "0:") {
            return 418;
        }
        if ($is_internal = 0) {
            break;
        }
        return 302 /moderator/$1$is_args$args;

        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    error_page 418 = @external_stub;
    location @external_stub {
        root /opt/nginx-static;
        try_files /external-stub.html =404;
        default_type text/html;
    }
}
