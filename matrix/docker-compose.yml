services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: "<REDACTED>"
      POSTGRES_DB: synapse
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./init-portal-db.sql:/docker-entrypoint-initdb.d/init-portal-db.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - matrixnet

  synapse:
    image: matrixdotorg/synapse:latest
    restart: unless-stopped
    depends_on:
      - postgres
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8008:8008"
    networks:
      - matrixnet

networks:
  matrixnet:
    driver: bridge
